name: MCP Apps UI adapters
on:
  pull_request:
    paths:
      - 'src/Unisono.McpApps/**'
      - 'src/Unisono.Mcp/**'
      - 'src/Unisono.UI.*/**'
      - 'samples/BlazorPupusas/**'
      - 'samples/ReactPupusas/**'
      - 'samples/McpAppsBridge/**'
      - 'samples/McpAppsPupusasHost/**'
      - 'samples/UiPlayground/**'
      - 'tests/**'
      - 'scripts/mcp-ui-smoke.py'
      - 'Unisono.slnx'
      - '.github/workflows/mcp-apps-ui-ci.yml'
  workflow_dispatch:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build framework-neutral adapters and host sample
        run: |
          dotnet build samples/McpAppsPupusasHost/McpAppsPupusasHost.csproj -c Release
          dotnet build samples/UiPlayground/UiPlayground.csproj -c Release
      - name: Test the catalog generator, validator and provider
        run: dotnet test tests/Unisono.UI.Catalog.Tests/Unisono.UI.Catalog.Tests.csproj -c Release
      - name: Pack the packages that ship with this feature
        # release.yml only packs on a tag; catch missing README/icon metadata on the PR.
        run: |
          dotnet pack src/Unisono.Core/Unisono.Core.csproj -c Release -o "$RUNNER_TEMP/nupkg"
          dotnet pack src/Unisono.McpApps/Unisono.McpApps.csproj -c Release -o "$RUNNER_TEMP/nupkg"
          dotnet pack src/Unisono.Mcp/Unisono.Mcp.csproj -c Release -o "$RUNNER_TEMP/nupkg"
          dotnet pack src/Unisono.UI.Catalog/Unisono.UI.Catalog.csproj -c Release -o "$RUNNER_TEMP/nupkg"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and embed the MCP Apps bridge in Blazor
        run: |
          cd samples/McpAppsBridge
          npm install --no-audit --no-fund
          npm run build
          cp dist/unisono-mcp-bridge.js ../BlazorPupusas/wwwroot/unisono-mcp-bridge.js
      - name: Publish Blazor WASM sample
        run: dotnet publish samples/BlazorPupusas/BlazorPupusas.csproj -c Release -o "$RUNNER_TEMP/blazor"
      - name: Smoke-test live MCP UI tool and resource protocol
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project samples/McpAppsPupusasHost -- blazor "$RUNNER_TEMP/blazor/wwwroot" https://static.example.com/blazor-pupusas/ > /tmp/unisono-mcp-ui.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/unisono-mcp-ui.log' EXIT
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:8792/mcp -o /dev/null 2>/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/mcp-ui-smoke.py http://127.0.0.1:8792/mcp
      - name: Smoke-test the declarative catalog host
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          dotnet run --no-build -c Release --project samples/McpAppsPupusasHost -- catalog > /tmp/unisono-catalog.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/unisono-catalog.log' EXIT
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:8792/mcp -o /dev/null 2>/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/mcp-ui-smoke.py http://127.0.0.1:8792/mcp
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/CatalogRenderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test the catalog renderer
        run: npm test
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [samples/ReactPupusas, samples/McpAppsBridge]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Bundle
        run: npm run build
